<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracker · TIL JHIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Evil Vampire'; src: url('EvilVampire-Regular.ttf') format('truetype'); font-display: swap; }

:root {
  --bg: #0b0a0c; --card: #151217; --card2: #1c181f; --line: #2b2530;
  --txt: #ede6ea; --mut: #9a909c;
  --dbd: #e0202a; --over: #8B3DFF; --flix: #f5b642;
  --cor: var(--dbd);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
body {
  background: radial-gradient(ellipse at top, color-mix(in srgb, var(--cor) 14%, transparent), transparent 60%), var(--bg);
  background-attachment: fixed;
  color: var(--txt); font-family: 'Carlito', Calibri, sans-serif; min-height: 100vh;
  transition: background .4s;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 40px; }

header { text-align: center; margin-bottom: 22px; }
.logo { font-family: 'Evil Vampire', Georgia, serif; font-size: 44px; letter-spacing: 2px; color: var(--cor); text-shadow: 0 0 18px color-mix(in srgb, var(--cor) 45%, transparent); transition: color .4s; }
.sub { color: var(--mut); font-size: 15px; margin-top: 2px; }

nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
nav button {
  background: var(--card); border: 1px solid var(--line); color: var(--mut);
  font: 700 16px 'Carlito', Calibri, sans-serif; letter-spacing: 1px;
  padding: 12px 6px; border-radius: 10px; cursor: pointer; transition: all .2s;
}
nav button:hover { color: var(--txt); }
nav button.on { color: #fff; border-color: var(--cor); background: color-mix(in srgb, var(--cor) 22%, var(--card)); }
nav button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }

.status { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 14px; color: var(--mut); }
.pill { padding: 5px 12px; border-radius: 99px; font-weight: 700; font-size: 13px; letter-spacing: .5px; border: 1px solid var(--line); background: var(--card); }
.pill.ok { color: #fff; border-color: var(--cor); background: color-mix(in srgb, var(--cor) 25%, var(--card)); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--cor); margin-bottom: 6px; }
.big { font-family: 'Evil Vampire', Georgia, serif; font-size: 34px; line-height: 1.1; word-break: break-word; }
.who { color: var(--mut); margin-top: 4px; font-size: 15px; }
.tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #fff; background: color-mix(in srgb, var(--cor) 40%, transparent); vertical-align: middle; }
.tag.out { background: transparent; border: 1px solid var(--line); color: var(--mut); }

ol { list-style: none; }
ol li { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
ol li:first-child { border-top: 0; }
.n { min-width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; background: var(--card2); color: var(--cor); }
.nm { flex: 1; min-width: 0; font-weight: 700; font-size: 17px; }
.nm small { display: block; font-weight: 400; color: var(--mut); font-size: 14px; }
ol li.sepl { display: block; padding: 12px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: 2px; color: var(--mut); border-top: 1px dashed var(--line); }
ol li.risc { opacity: .5; }
ol li.risc .n { color: var(--mut); }
.vazio { color: var(--mut); text-align: center; padding: 10px 0; }

.como { font-size: 15px; line-height: 1.5; color: var(--mut); }
.como b { color: var(--txt); }
.btn { display: block; text-align: center; margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--cor); color: #fff; font-weight: 700; text-decoration: none; letter-spacing: 1px; }
footer { text-align: center; color: var(--mut); font-size: 13px; margin-top: 24px; }

/* ---------- modo admin (só com ?admin no link) ---------- */
.adm { display: flex; gap: 6px; margin-left: auto; }
.adm button, .dlg button {
  background: var(--card2); border: 1px solid var(--line); color: var(--txt);
  font: 700 12px 'Carlito', Calibri, sans-serif; letter-spacing: 1px;
  padding: 6px 10px; border-radius: 8px; cursor: pointer;
}
.adm button:hover, .dlg button:hover { border-color: var(--cor); }
.adm button[data-acao="aceito"], .dlg button.pri { background: var(--cor); border-color: var(--cor); color: #fff; }
.adm-wait { margin-left: auto; font-size: 13px; color: var(--mut); }
.topo-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
.topo-row > div:first-child { flex: 1; min-width: 0; }

/* selo no canto: 🔒 deslogado · ● ADMIN logado */
.adm-badge {
  position: fixed; right: 16px; bottom: 16px; z-index: 10;
  background: var(--card); border: 1px solid var(--line); color: var(--mut);
  font: 700 12px 'Carlito', Calibri, sans-serif; letter-spacing: 1px;
  padding: 7px 11px; border-radius: 99px; cursor: pointer; opacity: .7; transition: all .2s;
}
.adm-badge:hover { opacity: 1; }
.adm-badge.on { opacity: 1; color: #fff; border-color: var(--cor); }
.adm-badge.on::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--cor); box-shadow: 0 0 8px var(--cor); margin-right: 6px; vertical-align: middle; }
.adm-badge.erro { color: #fff; border-color: var(--dbd); }

/* popup */
.dlg { margin: auto; width: min(340px, calc(100% - 32px)); background: var(--card); color: var(--txt); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.dlg::backdrop { background: rgba(0, 0, 0, .6); }
.dlg input { width: 100%; margin-top: 6px; background: var(--card2); border: 1px solid var(--line); color: var(--txt); padding: 9px 10px; border-radius: 8px; font: 15px 'Carlito', Calibri, sans-serif; }
.dlg input:focus { outline: none; border-color: var(--cor); }
.dlg-msg { min-height: 18px; margin-top: 8px; font-size: 13px; color: var(--mut); }
.dlg-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">TIL JHIN</div>
    <div class="sub">Acompanhe a fila da live · Bigodinhos</div>
  </header>

  <nav id="tabs">
    <button data-aba="dbd" data-nome="DBD">DBD</button>
    <button data-aba="over" data-nome="OVER">OVER</button>
    <button data-aba="flix" data-nome="BIGOFLIX">BIGOFLIX</button>
  </nav>

  <div class="status">
    <span id="pill" class="pill">carregando…</span>
    <span id="upd"></span>
  </div>

  <div id="topo"></div>

  <div class="card">
    <div class="lbl" id="filaLbl">NA FILA</div>
    <ol id="lista"></ol>
  </div>

  <div class="card" id="feitosCard" hidden>
    <div class="lbl">FEITOS HOJE</div>
    <ol id="feitos"></ol>
  </div>

  <div class="card">
    <div class="lbl">COMO PEDIR</div>
    <div class="como" id="como"></div>
    <a class="btn" id="btnPix" target="_blank" rel="noopener">PEDIR PELO LIVEPIX</a>
  </div>

  <footer>@tiljhin em todas as redes</footer>
</div>

<!-- modo admin: selo no canto + popup (só aparecem com ?admin no link) -->
<button id="admBadge" class="adm-badge" hidden></button>
<dialog id="admDlg" class="dlg">
  <form id="admForm">
    <div class="lbl">MODO ADMIN</div>
    <div id="admLogin">
      <input id="admSenha" type="password" placeholder="senha do tracker" autocomplete="current-password">
    </div>
    <div class="dlg-msg" id="admMsg"></div>
    <div class="dlg-btns">
      <button type="button" id="admFechar">FECHAR</button>
      <button type="button" id="admSair" class="pri">SAIR</button>
      <button type="submit" id="admEntrar" class="pri">ENTRAR</button>
    </div>
  </form>
</dialog>

<script>
/* ================= CONFIGURE AQUI ================= */
const SUPABASE_URL = 'https://fglwlmuyfojabpilhcdc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZsrsSUmFlaPBKu_OeTGbMQ_zFKihTo4';   // a pública, que só lê
const LIVEPIX      = 'https://livepix.gg/tiljhin';
const ATUALIZAR_SEG = 5;    // de quanto em quanto tempo a página busca a fila
const ADMIN_SEG     = 2;    // no modo admin, busca mais rápido
const OFFLINE_MIN   = 30;   // sem atualização há X min = "live offline"

const ABAS = {
  dbd:  { cor: '--dbd',  agora: 'KILLER AGORA', vazio: 'Nenhum killer na fila. Seja o primeiro!', outro: 'Overwatch',
          como: 'Mande um Pix pelo LivePix com o <b>nome do killer</b> na mensagem.<br><b>R$ 1</b> escolhe o killer · <b>R$ 2</b> escolhe com build (escreva "build").' },
  over: { cor: '--over', agora: 'HERÓI AGORA',  vazio: 'Nenhum herói na fila. Seja o primeiro!', outro: 'DBD',
          como: 'Mande um Pix pelo LivePix com o <b>nome do herói</b> na mensagem.<br><b>R$ 1</b> escolhe o herói da próxima partida.' },
  flix: { cor: '--flix', agora: 'FILME DA SEMANA', vazio: 'Nenhum pedido de filme ainda.',
          como: 'Mande um Pix de <b>R$ 15</b> pelo LivePix com a palavra <b>filme</b> e o nome do filme na mensagem.' }
};
// etiqueta de cada origem (igual ao HUD)
const TAGS = { doacao: 'PIX', sub: 'SUB', resub: 'RESUB', gift: 'GIFT', pontos: 'SUCOS' };
/* ================================================== */

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let dados = {}, aba = null, timer = null;

// modo admin: link com ?admin · a senha fica salva só neste navegador
const ADMIN = new URLSearchParams(location.search).has('admin');
let senha = '';
try { senha = localStorage.getItem('trkSenha') || ''; } catch (e) {}
const pend = {}; // pedidos com clique enviado, esperando o HUD aplicar

function haQuanto(iso) {
  const min = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'agora mesmo';
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min / 60);
  return h < 24 ? `há ${h} h` : `há ${Math.floor(h / 24)} dia(s)`;
}

// a aba só conta como "com dado" depois que o HUD mandou alguma coisa
const temDado = d => d && Object.keys(d).length > 0;

function tags(i) {
  return (i.build ? '<span class="tag">BUILD</span>' : '')
       + (TAGS[i.origem] ? `<span class="tag${i.origem === 'pontos' ? ' out' : ''}">${TAGS[i.origem]}</span>` : '');
}

function botoes(i, noTopo) {
  if (!ADMIN || !senha || !i.id) return '';
  if (pend[i.id] && Date.now() - pend[i.id] < 15000) return '<span class="adm-wait">enviando…</span>';
  const b = (acao, txt) => `<button data-id="${esc(i.id)}" data-acao="${acao}">${txt}</button>`;
  return `<div class="adm">${noTopo ? '' : b('aceito', 'ACEITO')}${b('feito', 'FEITO')}${b('recusado', 'RECUSADO')}</div>`;
}

function render() {
  if (!aba) return;
  const a = ABAS[aba], linha = dados[aba] || {}, d = linha.data || {};
  const recebeu = temDado(d);
  const offline = !recebeu || !linha.updated_at || (Date.now() - new Date(linha.updated_at)) / 60000 > OFFLINE_MIN;
  document.documentElement.style.setProperty('--cor', `var(${a.cor})`);

  // abas: pontinho na cor do jogo que está ativo na live
  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.aba === aba);
    const ativo = b.dataset.aba !== 'flix' && dados[b.dataset.aba]?.data?.ativo === true;
    const c = `var(${ABAS[b.dataset.aba].cor})`;
    b.innerHTML = b.dataset.nome + (ativo ? `<span class="dot" style="background:${c};box-shadow:0 0 8px ${c}"></span>` : '');
  });

  // status
  let txt = 'Live offline', ok = false;
  if (!offline) {
    if (aba === 'flix') { txt = 'Pedidos abertos'; ok = true; }
    else if (d.ativo !== true) txt = `Fila pausada · live em ${a.outro}`;
    else if (d.aberta === false) txt = 'Fila fechada';
    else { txt = 'Fila aberta'; ok = true; }
  }
  $('pill').textContent = txt;
  $('pill').className = 'pill' + (ok ? ' ok' : '');
  $('upd').textContent = recebeu && linha.updated_at ? 'atualizado ' + haQuanto(linha.updated_at) : '';

  // topo: AGORA (DBD/Over) ou filme da semana (BigoFlix)
  const top = aba === 'flix' ? d.filme : d.atual;
  if (top) {
    const titulo = aba === 'flix' ? top.titulo : top.escolha;
    const who = aba === 'flix' ? (top.onde || (top.quem ? 'pedido de ' + top.quem : '')) : 'pedido de ' + top.quem;
    $('topo').innerHTML = `
      <div class="card">
        <div class="lbl">${a.agora}</div>
        <div class="topo-row">
          <div>
            <div class="big">${esc(titulo)}</div>
            <div class="who">${esc(who)}${aba === 'flix' ? '' : tags(top)}</div>
          </div>
          ${botoes(top, true)}
        </div>
      </div>`;
  } else $('topo').innerHTML = '';

  // fila: pagos em cima, divisória, pedidos com SUCOS, e os recusados riscados no fim
  const fila = Array.isArray(d.fila) ? d.fila : [];
  const rec = Array.isArray(d.recusados) ? d.recusados : [];
  $('filaLbl').textContent = `NA FILA · ${fila.length}`;
  let h = '';
  fila.forEach((i, k) => {
    if (i.origem === 'pontos' && (k === 0 || fila[k - 1].origem !== 'pontos')) h += '<li class="sepl">PEDIDOS COM SUCOS</li>';
    h += `<li><span class="n">${k + 1}</span><div class="nm">${esc(i.escolha)}${tags(i)}<small>${esc(i.quem)}</small></div>${botoes(i)}</li>`;
  });
  if (!fila.length) h += `<li><div class="vazio" style="width:100%">${a.vazio}</div></li>`;
  if (rec.length) {
    h += '<li class="sepl">RECUSADOS</li>';
    rec.forEach(i => { h += `<li class="risc"><span class="n">✕</span><div class="nm"><s>${esc(i.escolha)}</s><small>${esc(i.quem)}</small></div></li>`; });
  }
  $('lista').innerHTML = h;

  // feitos hoje
  const feitos = Array.isArray(d.feitos) ? d.feitos : [];
  $('feitosCard').hidden = !feitos.length;
  $('feitos').innerHTML = feitos.map(i => `<li><span class="n">✔</span><div class="nm">${esc(i.escolha)}${i.build ? '<span class="tag">BUILD</span>' : ''}<small>${esc(i.quem)}</small></div></li>`).join('');

  $('como').innerHTML = a.como;
  $('btnPix').href = LIVEPIX;
}

async function rpc(fn, body) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return r.ok;
  } catch (e) { return false; }
}

async function buscar() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/tracker?select=id,data,updated_at`, { headers: { apikey: SUPABASE_KEY } });
    if (!r.ok) throw new Error(r.status);
    dados = Object.fromEntries((await r.json()).map(l => [l.id, l]));
    if (!aba) aba = ABAS[location.hash.slice(1)] ? location.hash.slice(1) : (dados.over?.data?.ativo === true ? 'over' : 'dbd');
    // o HUD já aplicou o clique (a aba foi atualizada depois dele): libera o botão
    const upd = new Date(dados[aba]?.updated_at || 0).getTime();
    Object.keys(pend).forEach(id => { if (upd > pend[id] || Date.now() - pend[id] > 15000) delete pend[id]; });
    render();
  } catch (e) {
    $('pill').textContent = 'sem conexão';
    $('pill').className = 'pill';
  }
}

function ciclo() {
  clearInterval(timer);
  if (!document.hidden) { buscar(); timer = setInterval(buscar, (ADMIN ? ADMIN_SEG : ATUALIZAR_SEG) * 1000); }
}

/* ---------- MODO ADMIN ---------- */
let erroT = null;

// selo do canto: 🔒 deslogado · ● ADMIN logado
function admUI() {
  if (!ADMIN) return;
  const b = $('admBadge');
  b.hidden = false;
  b.className = 'adm-badge' + (senha ? ' on' : '');
  b.textContent = senha ? 'ADMIN' : '🔒';
  b.title = senha ? 'Modo admin ativo' : 'Entrar no modo admin';
}

// erro rápido no selo (some em 4 s)
function avisar(t) {
  const b = $('admBadge');
  b.className = 'adm-badge erro';
  b.textContent = '⚠ ' + t;
  clearTimeout(erroT);
  erroT = setTimeout(admUI, 4000);
}

function abrirPopup(msg) {
  $('admLogin').hidden = !!senha;
  $('admEntrar').hidden = !!senha;
  $('admSair').hidden = !senha;
  $('admMsg').textContent = msg || (senha
    ? 'ACEITO vira o AGORA · FEITO vai pro histórico · RECUSADO fica riscado.'
    : 'Digite a senha do tracker (a mesma do HUD).');
  $('admSenha').value = '';
  $('admDlg').showModal();
  if (!senha) $('admSenha').focus();
}

$('admBadge').addEventListener('click', () => abrirPopup());
$('admFechar').addEventListener('click', () => $('admDlg').close());
$('admDlg').addEventListener('click', e => { if (e.target === $('admDlg')) $('admDlg').close(); }); // clique fora fecha

$('admForm').addEventListener('submit', async e => {
  e.preventDefault();
  const s = $('admSenha').value.trim();
  if (!s) return;
  $('admMsg').textContent = 'conferindo…';
  const ok = await rpc('tracker_acao', { segredo: s, p_item: '', p_acao: 'login' });
  if (!ok) { $('admMsg').textContent = 'Senha errada.'; return; }
  senha = s;
  try { localStorage.setItem('trkSenha', s); } catch (e) {}
  $('admDlg').close();
  admUI(); render();
});

$('admSair').addEventListener('click', () => {
  senha = '';
  try { localStorage.removeItem('trkSenha'); } catch (e) {}
  $('admDlg').close();
  admUI(); render();
});

document.addEventListener('click', async e => {
  const b = e.target.closest('.adm button');
  if (!b) return;
  const { id, acao } = b.dataset;
  pend[id] = Date.now();
  render();
  const ok = await rpc('tracker_acao', { segredo: senha, p_item: id, p_acao: acao });
  if (!ok) { delete pend[id]; avisar('erro'); render(); }
});

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  aba = b.dataset.aba; history.replaceState(null, '', '#' + aba); render();
});
document.addEventListener('visibilitychange', ciclo);
admUI();
ciclo();
</script>
</body>
</html>
