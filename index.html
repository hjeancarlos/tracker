<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tracker · TIL JHIN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Evil Vampire'; src: url('EvilVampire-Regular.ttf') format('truetype'); font-display: swap; }

:root {
  --bg: #0b0a0c; --card: #151217; --card2: #1c181f; --line: #2b2530;
  --txt: #ede6ea; --mut: #9a909c;
  --dbd: #e0202a; --over: #8B3DFF; --flix: #f5b642;
  --cor: var(--dbd);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(ellipse at top, color-mix(in srgb, var(--cor) 14%, transparent), transparent 60%), var(--bg);
  background-attachment: fixed;
  color: var(--txt); font-family: 'Carlito', Calibri, sans-serif; min-height: 100vh;
  transition: background .4s;
}
.wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 40px; }

header { text-align: center; margin-bottom: 22px; }
.logo { font-family: 'Evil Vampire', Georgia, serif; font-size: 44px; letter-spacing: 2px; color: var(--cor); text-shadow: 0 0 18px color-mix(in srgb, var(--cor) 45%, transparent); transition: color .4s; }
.sub { color: var(--mut); font-size: 15px; margin-top: 2px; }

nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
nav button {
  background: var(--card); border: 1px solid var(--line); color: var(--mut);
  font: 700 16px 'Carlito', Calibri, sans-serif; letter-spacing: 1px;
  padding: 12px 6px; border-radius: 10px; cursor: pointer; transition: all .2s;
}
nav button:hover { color: var(--txt); }
nav button.on { color: #fff; border-color: var(--cor); background: color-mix(in srgb, var(--cor) 22%, var(--card)); }
nav button .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--dbd); margin-left: 6px; vertical-align: middle; box-shadow: 0 0 8px var(--dbd); }

.status { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 14px; color: var(--mut); }
.pill { padding: 5px 12px; border-radius: 99px; font-weight: 700; font-size: 13px; letter-spacing: .5px; border: 1px solid var(--line); background: var(--card); }
.pill.ok { color: #fff; border-color: var(--cor); background: color-mix(in srgb, var(--cor) 25%, var(--card)); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
.lbl { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: var(--cor); margin-bottom: 6px; }
.big { font-family: 'Evil Vampire', Georgia, serif; font-size: 34px; line-height: 1.1; word-break: break-word; }
.who { color: var(--mut); margin-top: 4px; font-size: 15px; }
.tag { display: inline-block; margin-left: 8px; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; color: #fff; background: color-mix(in srgb, var(--cor) 40%, transparent); vertical-align: middle; }

ol { list-style: none; counter-reset: n; }
ol li { counter-increment: n; display: flex; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
ol li:first-child { border-top: 0; }
ol li::before { content: counter(n); min-width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-weight: 700; background: var(--card2); color: var(--cor); }
.nm { font-weight: 700; font-size: 17px; }
.nm small { display: block; font-weight: 400; color: var(--mut); font-size: 14px; }
.vazio { color: var(--mut); text-align: center; padding: 10px 0; }

.como { font-size: 15px; line-height: 1.5; color: var(--mut); }
.como b { color: var(--txt); }
.btn { display: block; text-align: center; margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--cor); color: #fff; font-weight: 700; text-decoration: none; letter-spacing: 1px; }
footer { text-align: center; color: var(--mut); font-size: 13px; margin-top: 24px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">TIL JHIN</div>
    <div class="sub">Acompanhe a fila da live · Bigodinhos</div>
  </header>

  <nav id="tabs">
    <button data-aba="dbd">DBD</button>
    <button data-aba="over">OVER</button>
    <button data-aba="flix">BIGOFLIX</button>
  </nav>

  <div class="status">
    <span id="pill" class="pill">carregando…</span>
    <span id="upd"></span>
  </div>

  <div id="topo"></div>

  <div class="card">
    <div class="lbl" id="filaLbl">NA FILA</div>
    <ol id="lista"></ol>
  </div>

  <div class="card">
    <div class="lbl">COMO PEDIR</div>
    <div class="como" id="como"></div>
    <a class="btn" id="btnPix" target="_blank" rel="noopener">PEDIR PELO LIVEPIX</a>
  </div>

  <footer>@tiljhin em todas as redes</footer>
</div>

<script>
/* ================= CONFIGURE AQUI ================= */
const SUPABASE_URL = 'https://fglwlmuyfojabpilhcdc.supabase.co';
const SUPABASE_KEY = 'sb_publishable_ZsrsSUmFlaPBKu_OeTGbMQ_zFKihTo4';   // a pública, que só lê
const LIVEPIX      = 'https://livepix.gg/tiljhin';
const ATUALIZAR_SEG = 5;    // de quanto em quanto tempo a página busca a fila
const OFFLINE_MIN   = 30;   // sem atualização há X min = "live offline"

const ABAS = {
  dbd:  { cor: '--dbd',  agora: 'KILLER AGORA', vazio: 'Nenhum killer na fila. Seja o primeiro!', outro: 'Overwatch',
          como: 'Mande um Pix pelo LivePix com o <b>nome do killer</b> na mensagem.<br><b>R$ 1</b> escolhe o killer · <b>R$ 2</b> escolhe com build (escreva "build").' },
  over: { cor: '--over', agora: 'HERÓI AGORA',  vazio: 'Nenhum herói na fila. Seja o primeiro!', outro: 'DBD',
          como: 'Mande um Pix pelo LivePix com o <b>nome do herói</b> na mensagem.<br><b>R$ 1</b> escolhe o herói da próxima partida.' },
  flix: { cor: '--flix', agora: 'FILME DA SEMANA', vazio: 'Nenhum pedido de filme ainda.',
          como: 'Mande um Pix de <b>R$ 15</b> pelo LivePix com a palavra <b>filme</b> e o nome do filme na mensagem.' }
};
/* ================================================== */

const $ = id => document.getElementById(id);
const esc = s => (s ?? '').toString().replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let dados = {}, aba = null, timer = null;

function haQuanto(iso) {
  const min = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (min < 1) return 'agora mesmo';
  if (min < 60) return `há ${min} min`;
  const h = Math.floor(min / 60);
  return h < 24 ? `há ${h} h` : `há ${Math.floor(h / 24)} dia(s)`;
}

// a aba só conta como "com dado" depois que o HUD mandou alguma coisa
const temDado = d => d && Object.keys(d).length > 0;

function render() {
  if (!aba) return;
  const a = ABAS[aba], linha = dados[aba] || {}, d = linha.data || {};
  const recebeu = temDado(d);
  const offline = !recebeu || !linha.updated_at || (Date.now() - new Date(linha.updated_at)) / 60000 > OFFLINE_MIN;
  document.documentElement.style.setProperty('--cor', `var(${a.cor})`);

  document.querySelectorAll('#tabs button').forEach(b => {
    b.classList.toggle('on', b.dataset.aba === aba);
    const ativo = b.dataset.aba !== 'flix' && dados[b.dataset.aba]?.data?.ativo === true;
    b.innerHTML = b.textContent.replace(/\s+$/, '') + (ativo ? '<span class="dot"></span>' : '');
  });

  // status
  let txt = 'Live offline', ok = false;
  if (!offline) {
    if (aba === 'flix') { txt = 'Pedidos abertos'; ok = true; }
    else if (d.ativo !== true) txt = `Fila pausada · live em ${a.outro}`;
    else if (d.aberta === false) txt = 'Fila fechada';
    else { txt = 'Fila aberta'; ok = true; }
  }
  $('pill').textContent = txt;
  $('pill').className = 'pill' + (ok ? ' ok' : '');
  $('upd').textContent = recebeu && linha.updated_at ? 'atualizado ' + haQuanto(linha.updated_at) : '';

  // topo: AGORA (DBD/Over) ou filme da semana (BigoFlix)
  const top = aba === 'flix' ? d.filme : d.atual;
  $('topo').innerHTML = top ? `
    <div class="card">
      <div class="lbl">${a.agora}</div>
      <div class="big">${esc(aba === 'flix' ? top.titulo : top.escolha)}${top.build ? '<span class="tag">BUILD</span>' : ''}</div>
      <div class="who">${aba === 'flix' ? esc(top.onde || '') : 'pedido de ' + esc(top.quem)}</div>
    </div>` : '';

  // fila
  const fila = Array.isArray(d.fila) ? d.fila : [];
  $('filaLbl').textContent = `NA FILA · ${fila.length}`;
  $('lista').innerHTML = fila.length
    ? fila.map(i => `<li><div class="nm">${esc(i.escolha)}${i.build ? '<span class="tag">BUILD</span>' : ''}<small>${esc(i.quem)}</small></div></li>`).join('')
    : `<div class="vazio">${a.vazio}</div>`;

  $('como').innerHTML = a.como;
  $('btnPix').href = LIVEPIX;
}

async function buscar() {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/tracker?select=id,data,updated_at`, { headers: { apikey: SUPABASE_KEY } });
    if (!r.ok) throw new Error(r.status);
    dados = Object.fromEntries((await r.json()).map(l => [l.id, l]));
    if (!aba) aba = ABAS[location.hash.slice(1)] ? location.hash.slice(1) : (dados.over?.data?.ativo === true ? 'over' : 'dbd');
    render();
  } catch (e) {
    $('pill').textContent = 'sem conexão';
    $('pill').className = 'pill';
  }
}

function ciclo() {
  clearInterval(timer);
  if (!document.hidden) { buscar(); timer = setInterval(buscar, ATUALIZAR_SEG * 1000); }
}

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  aba = b.dataset.aba; history.replaceState(null, '', '#' + aba); render();
});
document.addEventListener('visibilitychange', ciclo);
ciclo();
</script>
</body>
</html>
